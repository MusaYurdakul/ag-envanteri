[tarama]
; Varsayilan taranacak ag araligi
varsayilan_ag = 192.168.1.0/24
; Es zamanli calisacak is parcacigi sayisi
is_parcacigi = 50
; Ping zaman asimi (milisaniye)
ping_zaman_asimi = 500

[portlar]
; Kontrol edilecek portlar: numara = aciklama
22 = SSH
80 = HTTP
443 = HTTPS
445 = SMB
3389 = RDP
8080 = HTTP-Alt
23 = Telnet
53 = DNS
88 = Kerberos
389 = LDAP
554 = RTSP
631 = IPP
9100 = JetDirect

[snmp]
; SNMP sorgulari yapilsin mi
etkin = true
community = public
zaman_asimi = 1
; Toner seviyesi bu yuzdenin altina duserse uyari verilir
toner_esigi = 20

[rapor]
; Cikti dosyalarinin yazilacagi klasor
cikti_klasoru = raporlar
; Dosya adi on eki
dosya_on_eki = envanter
[eposta]
etkin = true
; true iken mail gonderilmez, icerik loglar/son_bildirim.txt dosyasina yazilir
deneme_modu = true
sunucu = smtp.gmail.com
port = 587
gonderen = ornek@gmail.com
; Birden fazla alici virgulle ayrilir
alicilar = ornek@gmail.com
[guvenlik]
; Bu aglarla cakisan hicbir aralik taranmaz (sirket agi)
yasak_aglar = 10.0.0.0/8